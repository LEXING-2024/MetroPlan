<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#efeade" />
    <meta name="description" content="《交通规划》Transport Plan — 在端州与鼎湖之间规划轨道交通与城市出行的模拟游戏。" />
    <title>交通规划 · Transport Plan</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f7f3e9'/%3E%3Cpath d='M14 44 26 20l10 16 14-24' fill='none' stroke='%23c25b4a' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='14' cy='44' r='5' fill='%23f7f3e9' stroke='%232f332b' stroke-width='4'/%3E%3Ccircle cx='50' cy='12' r='5' fill='%23f7f3e9' stroke='%232f332b' stroke-width='4'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="app">
      <canvas id="stage"></canvas>
      <div id="game-ui"></div>
      <div id="overlay" class="hidden"></div>
      <div id="boot">
        <div class="boot-mark">
          <svg width="46" height="46" viewBox="0 0 64 64" aria-hidden="true">
            <path
              d="M12 46 26 18l10 18 16-28"
              fill="none"
              stroke="#c25b4a"
              stroke-width="5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <circle cx="12" cy="46" r="5.5" fill="#f7f3e9" stroke="#2f332b" stroke-width="4" />
            <circle cx="52" cy="8" r="5.5" fill="#f7f3e9" stroke="#2f332b" stroke-width="4" />
          </svg>
        </div>
        <div class="boot-title">交通规划</div>
        <div class="boot-sub">TRANSPORT PLAN · 0.9.2</div>
        <div class="boot-bar"><i></i></div>
        <div class="boot-note">正在展开端州 · 鼎湖</div>
      </div>

      <div id="game-loading" class="hidden" role="status" aria-live="polite" aria-label="正在加载">
        <div class="game-loading-card">
          <div class="gl-mark" aria-hidden="true">
            <svg width="38" height="38" viewBox="0 0 64 64">
              <path
                d="M12 46 26 18l10 18 16-28"
                fill="none"
                stroke="#c25b4a"
                stroke-width="4"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <circle cx="12" cy="46" r="4.6" fill="#f7f3e9" stroke="#2f332b" stroke-width="3" />
              <circle class="gl-node" cx="52" cy="8" r="4.6" fill="#f7f3e9" stroke="#2f332b" stroke-width="3" />
            </svg>
          </div>
          <div class="gl-copy">
            <div class="gl-kicker">TRANSPORT PLAN</div>
            <div class="gl-title" data-k="gl-title">正在生成城市</div>
            <div class="gl-note" data-k="gl-note">正在铺设路网与客流…</div>
          </div>
          <div class="gl-track" aria-hidden="true"><i></i></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
